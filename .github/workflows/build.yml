name: Build

on:
  workflow_dispatch:
    inputs:
      deploy_steam:
        description: 'Upload builds to Steam (beta branch)'
        type: boolean
        default: false
      steam_branch:
        description: 'Steam branch to set live (never "default")'
        type: string
        default: 'beta'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    # windows-2022 pinned deliberately: game-ci Windows images are ltsc2022-based,
    # and Windows containers require host/image version match (game-ci#766).
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: library-windows-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-windows-

      - name: Ensure Docker daemon is running
        shell: pwsh
        run: |
          # Runner image occasionally boots with the docker service stopped (seen 2026-08-08,
          # image win22/20260802.262 - "failed to connect to the docker API at npipe").
          $svc = Get-Service docker -ErrorAction SilentlyContinue
          if (-not $svc) { Get-Service | Where-Object Name -match 'docker|containerd'; exit 1 }
          if ($svc.Status -ne 'Running') { Start-Service docker }
          docker version | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (IL2CPP)
        shell: pwsh
        run: |
          $unityConfig = "$env:RUNNER_TEMP\unity-config"
          New-Item -ItemType Directory -Force $unityConfig | Out-Null

          # IL2CPP needs MSVC + Windows SDK, which the container borrows from the
          # runner's preinstalled Visual Studio (same approach as game-ci/unity-builder).
          New-Item -ItemType Directory -Force C:\regkeys | Out-Null
          reg export "HKLM\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\Windows\v10.0" C:\regkeys\winsdk.reg /y

          $licenseDir = "C:\Users\ContainerAdministrator\AppData\Local\Unity"
          docker run --rm `
            --memory 14g `
            --workdir c:/workspace `
            --env GITHUB_WORKSPACE=c:/workspace `
            --env BEE_CACHE_DIRECTORY=c:/workspace/Library/bee_cache `
            --env UNITY_EMAIL --env UNITY_PASSWORD `
            --volume "${env:GITHUB_WORKSPACE}:c:\workspace" `
            --volume "${unityConfig}:${licenseDir}" `
            --volume "C:/regkeys:C:/regkeys" `
            --volume "C:/Program Files/Microsoft Visual Studio:C:/Program Files/Microsoft Visual Studio" `
            --volume "C:/Program Files (x86)/Microsoft Visual Studio:C:/Program Files (x86)/Microsoft Visual Studio" `
            --volume "C:/Program Files (x86)/Windows Kits:C:/Program Files (x86)/Windows Kits" `
            --volume "C:/ProgramData/Microsoft/VisualStudio:C:/ProgramData/Microsoft/VisualStudio" `
            unityci/editor:windows-6000.3.20f1-windows-il2cpp-3.2.2 `
            powershell -NoProfile -Command "& 'c:/workspace/.github/workflows/install-llvmpipe.ps1' -EditorPath 'C:/UnityEditor/6000.3.20f1/Editor'; if (-not `$?) { exit 1 }; & 'C:/UnityEditor/6000.3.20f1/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client.exe' --activate-all --include-personal --username `$env:UNITY_EMAIL --password `$env:UNITY_PASSWORD; if (`$LASTEXITCODE -ne 0) { exit `$LASTEXITCODE }; & 'C:/UnityEditor/6000.3.20f1/Editor/Unity.exe' -force-opengl -quit -batchmode -nographics -silent-crashes -logfile - -projectPath c:/workspace -executeMethod Warlander.Deedplanner.Editor.BuildSystem.BuildWindows64 | Out-Host; exit `$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "Build/DeedPlanner Windows/DeedPlanner.exe")) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DeedPlanner Windows
          path: |
            Build/
            !Build/**/*BurstDebugInformation*
            !Build/**/*BackUpThisFolder*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: library-linux-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-linux-

      - name: Build (IL2CPP)
        run: |
          mkdir -p "$RUNNER_TEMP/unity-config"
          docker run --rm \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/unity-config:/root/.config/unity3d" \
            unityci/editor:ubuntu-6000.3.20f1-linux-il2cpp-3.2.2 \
            bash -lc '
              set -e
              /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client \
                --activate-all --include-personal \
                --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
              # xvfb + swrast (both in image) give the editor a real GL device; without it
              # headless builds bake a degraded shader variant set (missing shadows/lighting).
              xvfb-run -a unity-editor -quit -batchmode -logFile /dev/stdout -projectPath /workspace \
                -executeMethod "Warlander.Deedplanner.Editor.BuildSystem.BuildLinux"
            '
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Restore workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Verify build output
        run: test -f "Build/DeedPlanner Linux/DeedPlanner.x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DeedPlanner Linux
          path: |
            Build/
            !Build/**/*BurstDebugInformation*
            !Build/**/*BackUpThisFolder*
          if-no-files-found: error

  build-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: library-webgl-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-webgl-

      - name: Build (WebGL)
        run: |
          mkdir -p "$RUNNER_TEMP/unity-config"
          docker run --rm \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/unity-config:/root/.config/unity3d" \
            unityci/editor:ubuntu-6000.3.20f1-webgl-3.2.2 \
            bash -lc '
              set -e
              /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client \
                --activate-all --include-personal \
                --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
              # xvfb + swrast (both in image) give the editor a real GL device; without it
              # headless builds bake a degraded shader variant set (missing shadows/lighting).
              xvfb-run -a unity-editor -quit -batchmode -logFile /dev/stdout -projectPath /workspace \
                -executeMethod "Warlander.Deedplanner.Editor.BuildSystem.BuildWeb"
            '
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Restore workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Verify build output
        run: |
          test -f "Build/DeedPlanner 3 WebGL/index.html"
          compgen -G "Build/DeedPlanner 3 WebGL/Build/*.wasm" > /dev/null
          compgen -G "Build/DeedPlanner 3 WebGL/Build/*.data" > /dev/null
          if compgen -G "Build/DeedPlanner 3 WebGL/Build/*.gz" > /dev/null; then
            echo "Compressed build files present - will not boot on GitHub Pages"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DeedPlanner WebGL
          path: Build/DeedPlanner 3 WebGL/
          if-no-files-found: error

  # Steam upload runs on every v* tag push, or on manual dispatch with deploy_steam=true.
  # Depot ID assumption: 1179761 = Windows, 1179762 = Linux (Steam default: appId+1, appId+2).
  # If the partner site shows different IDs, add firstDepotIdOverride accordingly.
  # releaseBranch is a beta branch by design: players on default see nothing until the
  # build is set live manually in the App Admin panel (default cannot be set live via API).
  deploy-steam:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy_steam
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: steam-deploy
    steps:
      - name: Check Steam secrets
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          if [ -z "$STEAM_USERNAME" ] || [ -z "$STEAM_CONFIG_VDF" ]; then
            echo "Missing STEAM_USERNAME or STEAM_CONFIG_VDF secrets - skipping Steam deploy setup"
            exit 1
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DeedPlanner Windows
          path: dl/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DeedPlanner Linux
          path: dl/linux

      - name: Stage depot payload
        run: |
          # Artifacts contain Build/ contents directly (upload-artifact strips the common ancestor)
          mkdir -p steam/StandaloneWindows64 steam/StandaloneLinux64
          cp -r "dl/windows/DeedPlanner Windows/." steam/StandaloneWindows64/
          cp -r "dl/linux/DeedPlanner Linux/." steam/StandaloneLinux64/
          # steam_appid.txt is for out-of-Steam launches; Valve warns against shipping it in depots
          rm -f steam/StandaloneWindows64/steam_appid.txt steam/StandaloneLinux64/steam_appid.txt
          ls steam/StandaloneWindows64 steam/StandaloneLinux64

      - name: Deploy to Steam
        uses: game-ci/steam-deploy@8bd9baca6407f9abd210bd1eef3c45f56e12d8d9 # v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 1179760
          buildDescription: ${{ github.ref_name }}
          rootPath: steam
          depot1Path: StandaloneWindows64
          depot2Path: StandaloneLinux64
          releaseBranch: ${{ inputs.steam_branch || 'beta' }}
